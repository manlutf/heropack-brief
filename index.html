<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heropack Ad Studio — Brief</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="ui.css">
<style>
  /* ---------- header / hero ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
  .langs{display:flex;border:1px solid var(--rule);border-radius:var(--pill);padding:3px;gap:2px;background:var(--card)}
  .langs button{border:0;background:transparent;color:var(--body);font-family:var(--mono);font-size:12px;letter-spacing:.14em;padding:7px 14px;border-radius:var(--pill);cursor:pointer;transition:background var(--t),color var(--t)}
  .langs button:hover{color:var(--title)}
  .langs button[aria-pressed=true]{background:#fff;color:#000}
  .hero{padding:clamp(40px,7vw,96px) var(--gutter) clamp(32px,5vw,56px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center}
  .hero h1{max-width:16ch;margin-top:14px}
  .hero .sub{font-size:clamp(16px,1.8vw,19px);color:var(--body);max-width:52ch;margin-top:16px}
  .hero .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px}
  .hero .facts span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cardbody);display:inline-flex;align-items:center;gap:8px}
  .hero .facts span::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--yellow)}
  @media (max-width:720px){.hero{grid-template-columns:1fr;gap:20px}.hero .badge{order:-1;width:96px;height:96px}.hero .badge .star svg{width:20px;height:20px}}

  /* ---------- wizard ---------- */
  main{padding-top:clamp(28px,5vw,56px);padding-bottom:var(--vrhythm)}
  .wizard{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:start}
  .rail{position:sticky;top:24px;z-index:var(--z-sticky)}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:relative}
  .stepbtn{display:flex;align-items:flex-start;gap:14px;width:100%;background:none;border:0;padding:10px 10px;border-radius:var(--r-sm);text-align:start;color:var(--cardbody);cursor:pointer;transition:background var(--t),color var(--t);font:inherit}
  .stepbtn:hover:not(:disabled){background:var(--card);color:var(--title)}
  .stepbtn:disabled{cursor:default}
  .stepbtn .n{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;color:var(--cardbody);background:var(--bg);transition:background var(--t),border-color var(--t),color var(--t)}
  .stepbtn .tx{display:flex;flex-direction:column;gap:2px;min-width:0;padding-top:4px}
  .stepbtn b{font-weight:600;font-size:15px;color:inherit;line-height:1.3}
  .stepbtn small{font-size:12.5px;color:var(--meta-text);line-height:1.4}
  .steps li.is-current .stepbtn{color:var(--title)}
  .steps li.is-current .n{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:500}
  .steps li.is-done .n{border-color:var(--green);color:var(--green)}
  .steps li.is-done .stepbtn{color:var(--body)}
  .steps li + li .stepbtn::before{content:'';position:absolute}
  .railbar{height:3px;border-radius:var(--pill);background:var(--rule-soft);overflow:hidden;margin:8px 10px 0}
  .railbar i{display:block;height:100%;width:0;background:var(--grad-primary);transition:width .5s var(--ease-out)}
  .rail-note{margin:18px 10px 0;max-width:24ch}
  .panels{min-width:0}
  @keyframes step-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .step{animation:step-in .28s var(--ease-out) both}
  .step-head{padding-bottom:clamp(20px,3vw,28px);border-bottom:1px solid var(--rule);margin-bottom:clamp(20px,3vw,32px)}
  .step-k{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
  .step-head h2{font-size:clamp(26px,3.4vw,38px);margin-top:10px;outline:0}
  .step-head h2:focus-visible{outline:0}
  .step-head .lead{margin-top:8px;font-size:15px}
  .group{display:flex;flex-direction:column;gap:18px;padding:clamp(20px,3vw,28px) 0}
  .group + .group{border-top:1px solid var(--rule-soft)}
  .group > legend{float:inline-start;width:100%;margin-bottom:6px}
  .group > legend h3{font-size:19px;letter-spacing:-.015em}
  .group > legend p{font-size:14px;color:var(--cardbody);margin-top:4px}
  .step-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:clamp(20px,3vw,32px);margin-top:8px;border-top:1px solid var(--rule)}
  .step-nav .btn svg{transition:transform var(--t) var(--ease-out)}
  .step-nav .btn:hover [data-arrow]{transform:translateX(3px)}
  [dir=rtl] .step-nav .btn:hover [data-arrow]{transform:translateX(-3px)}
  [dir=rtl] .arrow{transform:scaleX(-1)}
  .step-nav .meta{margin-inline-start:auto}
  @media (max-width:860px){
    .wizard{grid-template-columns:1fr;gap:16px}
    .rail{top:0;background:var(--bg);margin:0 calc(-1 * var(--gutter));padding:10px var(--gutter) 10px;border-bottom:1px solid var(--rule)}
    .steps{flex-direction:row;gap:0}
    .steps li{flex:1;min-width:0}
    .stepbtn{padding:4px 2px;flex-direction:column;align-items:center;gap:6px;text-align:center}
    .stepbtn .n{width:26px;height:26px;font-size:11.5px}
    .stepbtn .tx{padding-top:0;align-items:center}
    .stepbtn b{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .stepbtn small,.rail-note{display:none}
    .railbar{margin:8px 0 0}
    .step-nav .meta{display:none}
    .step-nav{flex-wrap:wrap}
    .step-nav .btn[data-next],.step-nav #submitBtn{flex:1}
  }

  /* ---------- chips / refs / library ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips label{position:relative;cursor:pointer}
  .chips label input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .chips label span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:var(--pill);padding:9px 16px;font-size:14px;color:var(--body);background:var(--card);transition:border-color var(--t),color var(--t),background var(--t),transform var(--t) var(--ease-out)}
  .chips label:hover span{border-color:var(--eyebrow);color:var(--title)}
  .chips label input:checked + span{border-color:var(--yellow);color:var(--yellow);background:rgba(249,199,99,.1)}
  .chips label input:checked + span::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--yellow)}
  .chips label input:focus-visible + span{outline:2px solid var(--coral);outline-offset:3px}
  .chips label:active span{transform:scale(.97)}
  .refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media (max-width:980px){.refs{grid-template-columns:1fr}}
  .refcard{padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:none}
  .refhead{display:flex;align-items:center;gap:12px}
  .refhead .ic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--icon);flex:none}
  .refhead .ic svg{width:18px;height:18px}
  .refhead .t{color:var(--title);font-weight:700;font-size:15.5px;display:block}
  .refhead .d{font-size:13px;color:var(--meta-text);display:block}
  .refcard .drop{padding:18px 12px;font-size:13px}
  .refcard .drop svg{width:20px;height:20px}
  .linkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .linkrow .input{padding:9px 14px;font-size:14px}
  .insp{padding-top:8px}
  .insp-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .insp-head .hint{margin-top:2px}
  .lib{display:flex;gap:12px;margin:14px calc(-1 * var(--gutter)) 0;padding:4px var(--gutter) 12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
  @media (min-width:861px){.lib{margin:14px 0 0;padding:4px 0 12px}}
  .libcard{position:relative;flex:none;width:150px;scroll-snap-align:start;background:var(--card);border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden;cursor:pointer;text-align:start;padding:0;color:var(--body);font:inherit;transition:border-color var(--t),transform .3s var(--ease-out),box-shadow .3s var(--ease-out)}
  .libcard:hover{transform:translateY(-3px);border-color:var(--eyebrow);box-shadow:var(--shadow-hover)}
  .libcard[aria-pressed=true]{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}
  .libcard .th{aspect-ratio:9/12;background:#111 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--meta-text);font-family:var(--mono);font-size:11.5px;position:relative;overflow:hidden}
  .libcard .th video{width:100%;height:100%;object-fit:cover}
  .libcard .th .play{position:absolute;bottom:8px;inset-inline-end:8px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;color:#fff;opacity:.9;transition:opacity var(--t)}
  .libcard .th .play svg{width:9px;height:9px}
  .libcard:hover .th .play{opacity:0}
  .libcard .chk{position:absolute;top:8px;inset-inline-start:8px;width:22px;height:22px;border-radius:50%;background:var(--yellow);color:#000;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .25s var(--ease-out)}
  .libcard .chk svg{width:11px;height:11px}
  .libcard[aria-pressed=true] .chk{transform:scale(1)}
  .libcard .tt{padding:8px 10px 0;font-size:13px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .libcard .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--meta-text);padding:2px 10px 9px;text-transform:uppercase}
  .libcard.skel .th,.libcard.skel .tt,.libcard.skel .k{visibility:hidden}

  /* ---------- review ---------- */
  .rv-group{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--card)}
  .rv-group + .rv-group{margin-top:14px}
  .rv-group > header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule-soft)}
  .rv-group > header h3{font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .rv-group > header h3 .n{width:22px;height:22px;border-radius:50%;background:var(--green);color:#000;font-family:var(--mono);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
  .rv-group dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .rv-row{display:flex;flex-direction:column;gap:4px;padding:12px 18px;border-bottom:1px solid var(--rule-soft);min-width:0}
  .rv-row.wide{grid-column:1/-1}
  .rv-row:nth-last-child(-n+2){border-bottom:0}
  .rv-row dt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow)}
  .rv-row dd{margin:0;color:var(--title);font-size:14.5px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
  .rv-row dd .chip{margin-inline-end:4px}
  .rv-none{color:var(--meta-text);font-size:13px}
  .rv-files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .rv-files img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--rule)}
  .rv-files .chip{text-transform:none;letter-spacing:.02em;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:640px){.rv-group dl{grid-template-columns:1fr}.rv-row:nth-last-child(-n+2){border-bottom:1px solid var(--rule-soft)}.rv-row:last-child{border-bottom:0}}
  .consent{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--body);cursor:pointer;padding:16px 18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);transition:border-color var(--t)}
  .consent:hover{border-color:var(--eyebrow)}
  .consent:has(input:checked){border-color:var(--yellow)}
  .submitbar{display:flex;flex-direction:column;gap:14px}
  #progress{width:100%}
  #progress .meta{margin-top:8px}

  /* ---------- success ---------- */
  #success .card{padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
  #success .id{font-family:var(--mono);font-size:clamp(28px,5vw,44px);letter-spacing:.12em;color:var(--yellow);direction:ltr;margin:14px 0 4px;line-height:1}
  #success .next{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  #success .next li{border:1px solid var(--rule-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;color:var(--body);display:flex;gap:10px;align-items:flex-start}
  #success .next li b{font-family:var(--mono);font-weight:500;color:var(--green);font-size:12px;padding-top:2px}
  @media (max-width:720px){#success .card{grid-template-columns:1fr}#success .badge{width:96px;height:96px}#success .next{grid-template-columns:1fr}}
  footer{padding:28px var(--gutter);border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>

<header class="top container">
  <a class="wordmark" href="#"><b>Heropack</b><small>Ad Studio</small></a>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="ar" aria-pressed="true">عربي</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<section class="hero container">
  <div>
    <div class="eyebrow" data-t="hero_eyebrow"></div>
    <h1 data-t="hero_h1"></h1>
    <p class="sub" data-t="hero_sub"></p>
    <div class="facts"><span data-t="fact_time"></span><span data-t="fact_steps"></span><span data-t="fact_delivery"></span></div>
  </div>
  <div class="badge" aria-hidden="true">
    <svg class="ring" viewBox="0 0 150 150">
      <defs><path id="hp-c" d="M75,75 m-58,0 a58,58 0 1,1 116,0 a58,58 0 1,1 -116,0"></path></defs>
      <circle cx="75" cy="75" r="74" fill="#0A0A0A" stroke="#333" stroke-width="1"></circle>
      <text fill="#fff" direction="ltr" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.15"><textPath href="#hp-c">HEROPACK ✻ AD STUDIO ✻ HEROPACK ✻ AD STUDIO ✻</textPath></text>
    </svg>
    <div class="star"><svg width="30" height="30" viewBox="0 0 34 34" fill="none" stroke="#F9C763" stroke-width="2.6" stroke-linecap="round"><path d="M17 3 V31 M3 17 H31 M7 7 L27 27 M27 7 L7 27"></path></svg></div>
  </div>
</section>

<div class="marquee" aria-hidden="true">
  <div>
    <span>Product ad<i>✻</i>Storyboard<i>✻</i>Voice-over<i>✻</i>Reels 9:16<i>✻</i>Delivered in days<i>✻</i>إعلان منتج<i>✻</i>ستوري بورد<i>✻</i>تعليق صوتي<i>✻</i></span>
    <span>Product ad<i>✻</i>Storyboard<i>✻</i>Voice-over<i>✻</i>Reels 9:16<i>✻</i>Delivered in days<i>✻</i>إعلان منتج<i>✻</i>ستوري بورد<i>✻</i>تعليق صوتي<i>✻</i></span>
  </div>
</div>

<main class="container">
<form id="brief" class="wizard" novalidate>

  <aside class="rail" aria-label="Progress">
    <ol class="steps">
      <li data-step="1"><button type="button" class="stepbtn" data-go="1"><span class="n">1</span><span class="tx"><b data-t="st1"></b><small data-t="st1_d"></small></span></button></li>
      <li data-step="2"><button type="button" class="stepbtn" data-go="2"><span class="n">2</span><span class="tx"><b data-t="st2"></b><small data-t="st2_d"></small></span></button></li>
      <li data-step="3"><button type="button" class="stepbtn" data-go="3"><span class="n">3</span><span class="tx"><b data-t="st3"></b><small data-t="st3_d"></small></span></button></li>
    </ol>
    <div class="railbar" aria-hidden="true"><i></i></div>
    <p class="hint rail-note" data-t="rail_note"></p>
  </aside>

  <div class="panels" id="wizard">

    <!-- ===== STEP 1 · Product ===== -->
    <section class="step" data-step="1" aria-labelledby="h-step1">
      <header class="step-head"><div class="step-k"></div><h2 id="h-step1" tabindex="-1" data-t="st1_h"></h2><p class="lead" data-t="st1_lead"></p></header>

      <fieldset class="group">
        <legend><h3 data-t="s1_h"></h3><p data-t="s1_lead"></p></legend>
        <div class="grid-2">
          <div class="field"><label for="client_name"><span data-t="client_name"></span> <span class="req">*</span></label><input class="input" id="client_name" name="client_name" autocomplete="name" required><span class="err" data-t="e_req"></span></div>
          <div class="field"><label for="client_contact"><span data-t="client_contact"></span> <span class="req">*</span></label><input class="input" id="client_contact" name="client_contact" data-tp="client_contact_ph" required dir="ltr" style="text-align:start" autocomplete="tel"><span class="err" data-t="e_req"></span></div>
          <div class="field"><label for="brand_name"><span data-t="brand_name"></span> <span class="req">*</span></label><input class="input" id="brand_name" name="brand_name" required autocomplete="organization"><span class="err" data-t="e_req"></span></div>
          <div class="field"><label for="website"><span data-t="website"></span><span class="opt-tag" data-t="optional"></span></label><input class="input" id="website" name="website" data-tp="website_ph" dir="ltr" style="text-align:start" autocomplete="url"></div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend><h3 data-t="s2_h"></h3><p data-t="s2_lead"></p></legend>
        <div class="grid-2">
          <div class="field"><label for="product_name"><span data-t="product_name"></span> <span class="req">*</span></label><input class="input" id="product_name" name="product_name" required><span class="err" data-t="e_req"></span></div>
          <div class="field"><label for="category" data-t="category"></label>
            <select class="input" id="category" name="category">
              <option value="food" data-t="cat_food"></option><option value="beauty" data-t="cat_beauty"></option><option value="fashion" data-t="cat_fashion"></option>
              <option value="tech" data-t="cat_tech"></option><option value="home" data-t="cat_home"></option><option value="services" data-t="cat_services"></option><option value="other" data-t="cat_other"></option>
            </select></div>
        </div>
        <div class="field"><label for="product_desc"><span data-t="product_desc"></span><span class="opt-tag" data-t="optional"></span></label><textarea class="input" id="product_desc" name="product_desc" data-tp="product_desc_ph"></textarea></div>
        <div class="field"><label for="audience"><span data-t="audience"></span><span class="opt-tag" data-t="optional"></span></label><input class="input" id="audience" name="audience" data-tp="audience_ph"></div>
        <div class="field" id="f_product_images">
          <span class="label"><span data-t="product_images"></span> <span class="req">*</span></span>
          <div class="drop drop--lg" data-field="product_images"><input type="file" accept="image/*" multiple aria-label="product images">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
            <span class="d-t" data-t="images_drop_t"></span><span class="d-s" data-t="images_drop"></span></div>
          <div class="thumbs" data-list="product_images"></div>
          <span class="hint" data-t="images_hint"></span>
          <span class="err" data-t="e_images"></span>
        </div>
        <div class="field">
          <span class="label"><span data-t="logo"></span><span class="opt-tag" data-t="optional"></span></span>
          <div class="drop" data-field="logo"><input type="file" accept="image/*,.svg" aria-label="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            <span class="d-s" data-t="logo_drop"></span></div>
          <div class="thumbs" data-list="logo"></div>
        </div>
      </fieldset>

      <div class="step-nav">
        <span></span>
        <span class="meta"><span data-t="next_is"></span> <span data-t="st2"></span></span>
        <button type="button" class="btn" data-next><span data-t="next"></span><svg class="arrow" data-arrow viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
      </div>
    </section>

    <!-- ===== STEP 2 · Ad & references ===== -->
    <section class="step" data-step="2" aria-labelledby="h-step2" hidden>

/* ---------- file state ---------- */
// item: { file?, link?, note, name, size, preview?, lib?, kind?, thumb? }
const F = { product_images: [], logo: [], ref_vo: [], ref_video: [], ref_vibes: [] };

function addFiles(field, files){
  const max = LIMITS[field];
  for (const file of files) {
    if (max && F[field].length >= max) { if (max > 1) { toast(t('e_toomany'), true); continue; } else F[field] = []; }
    const kind = file.type.startsWith('image/') ? 'image' : file.type.startsWith('audio/') ? 'audio' : file.type.startsWith('video/') ? 'video' : 'file';
    F[field].push({ file, name: file.name, size: file.size, note: '', kind, preview: URL.createObjectURL(file) });
  }
  render(field);
}
function addLink(field, link){
  try { new URL(link); } catch { toast(t('e_link'), true); return; }
  F[field].push({ link, name: link, note: '' }); render(field);
}
function removeItem(field, i){ const it = F[field][i]; if (it.preview) URL.revokeObjectURL(it.preview); F[field].splice(i, 1); render(field); }
function moveItem(field, from, to){ if (to < 0 || to >= F[field].length || from === to) return; const [it] = F[field].splice(from, 1); F[field].splice(to, 0, it); render(field); }

let dragFrom = null;
function render(field){
  const box = document.querySelector(`[data-list="${field}"]`);
  box.innerHTML = '';
  const last = F[field].length - 1;
  F[field].forEach((it, i) => {
    if (box.classList.contains('thumbs')) {
      const d = document.createElement('div'); d.className = 'thumb'; d.draggable = F[field].length > 1;
      d.innerHTML = `<img src="${it.preview || ''}" alt=""><span class="n">${numL(i + 1)}</span>
        <div class="acts"><button type="button" class="mv" data-dir="-1" aria-label="${esc(t('move_prev'))}" ${i === 0 ? 'disabled' : ''}>‹</button>
        <button type="button" class="x" aria-label="${esc(t('remove'))}">×</button>
        <button type="button" class="mv" data-dir="1" aria-label="${esc(t('move_next'))}" ${i === last ? 'disabled' : ''}>›</button></div>`;
      d.querySelector('.x').onclick = () => removeItem(field, i);
      d.querySelectorAll('.mv').forEach(b => b.onclick = () => moveItem(field, i, i + Number(b.dataset.dir)));
      d.addEventListener('dragstart', e => { dragFrom = i; d.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); });
      d.addEventListener('dragend', () => { d.classList.remove('dragging'); box.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
      d.addEventListener('dragover', e => { if (dragFrom == null) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; d.classList.add('over'); });
      d.addEventListener('dragleave', () => d.classList.remove('over'));
      d.addEventListener('drop', e => { if (dragFrom == null) return; e.preventDefault(); e.stopPropagation(); const from = dragFrom; dragFrom = null; moveItem(field, from, i); });
      box.appendChild(d);
    } else {
      const d = document.createElement('div'); d.className = 'fileitem';
      const u = it.preview || it.link || '';
      let icon = ICON.file, media = '';
      if (it.lib) icon = it.thumb ? `<img src="${esc(it.thumb)}" alt="">` : ICON.star;
      else if (it.link) icon = isImgUrl(u) ? `<img src="${esc(u)}" alt="">` : ICON.link;
      else if (it.kind === 'image') icon = `<img src="${esc(u)}" alt="">`;
      else if (it.kind === 'audio') icon = ICON.audio;
      else if (it.kind === 'video') icon = ICON.video;
      if (it.file && it.kind === 'audio') media = `<div class="media"><audio controls preload="metadata" src="${esc(u)}"></audio></div>`;
      else if (it.file && it.kind === 'video') media = `<div class="media"><video controls muted playsinline preload="metadata" src="${esc(u)}"></video></div>`;
      else if (it.file && it.kind === 'image' && field === 'ref_vibes') media = `<div class="media"><img src="${esc(u)}" alt=""></div>`;
      else if (it.link && isVid(u)) media = `<div class="media"><video controls muted playsinline preload="metadata" src="${esc(u)}"></video></div>`;
      const label = it.lib ? esc(it.name) : it.link ? esc(host(it.name)) : esc(it.name);
      d.innerHTML = `<span class="ic">${icon}</span><span class="nm" dir="auto" title="${esc(it.name)}">${label}${it.size ? `<span class="sz">${fmtSize(it.size)}</span>` : ''}${it.lib ? ` <span class="lib-tag">✻ ${esc(t('lib_tag'))}</span>` : ''}</span>
        <button type="button" class="btn btn--ghost btn--xs btn--icon" aria-label="${esc(t('remove'))}">×</button>
        ${media}<input class="input" placeholder="${esc(t('note_ph'))}" value="${esc(it.note)}">`;
      d.querySelector('button').onclick = () => removeItem(field, i);
      d.querySelector('input').oninput = e => it.note = e.target.value;
      box.appendChild(d);
    }
  });
  if (field === 'product_images' && F.product_images.length) $('#f_product_images .err').classList.remove('show');
  syncLib();
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- wizard ---------- */
const STEPS = 3; let step = 1; const visited = new Set([1]);
function paintRail(){
  document.querySelectorAll('.steps li').forEach(li => {
    const n = Number(li.dataset.step), btn = li.querySelector('.stepbtn');
    li.classList.toggle('is-current', n === step); li.classList.toggle('is-done', n < step);
    li.querySelector('.n').innerHTML = n < step ? ICON.check : numL(n);
    btn.disabled = !(visited.has(n) || n < step); btn.setAttribute('aria-current', n === step ? 'step' : 'false');
  });
  $('.railbar i').style.width = ((step - 1) / (STEPS - 1) * 100) + '%';
  document.querySelectorAll('.step-k').forEach(el => el.textContent = t('step_of').replace('{n}', numL(el.closest('.step').dataset.step)).replace('{total}', numL(STEPS)));
}
function go(n){
  if (n < 1 || n > STEPS) return;
  if (n > step) for (let i = step; i < n; i++) if (!validateStep(i)) { if (i !== step) show(i); return; }
  show(n);
}
function show(n){
  step = n; visited.add(n);
  document.querySelectorAll('.step').forEach(s => s.hidden = Number(s.dataset.step) !== n);
  if (n === STEPS) renderReview();
  $('#formError').hidden = true; paintRail();
  const top = $('#wizard').getBoundingClientRect().top + window.scrollY - (innerWidth <= 860 ? 76 : 24);
  window.scrollTo({ top: Math.max(0, top), behavior: reduced ? 'auto' : 'smooth' });
  document.querySelector(`.step[data-step="${n}"] h2`).focus({ preventScroll: true });
}
function markField(inp, bad){ inp.setAttribute('aria-invalid', String(bad)); inp.closest('.field')?.querySelector('.err')?.classList.toggle('show', bad); }
function validateStep(n){
  const sec = document.querySelector(`.step[data-step="${n}"]`); let first = null;
  sec.querySelectorAll('[required]').forEach(inp => { const bad = !inp.value.trim(); markField(inp, bad); if (bad && !first) first = inp; });
  if (n === 1) { const imgBad = F.product_images.length < 1 || F.product_images.length > 10; $('#f_product_images .err').classList.toggle('show', imgBad); if (imgBad && !first) first = $('#f_product_images'); }
  if (n === 3) { const cBad = !$('#consent').checked; $('#consent').closest('.field').querySelector('.err').classList.toggle('show', cBad); if (cBad && !first) first = $('#consent'); }
  if (first) { showError(t('e_fix')); first.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }); first.focus?.({ preventScroll: true }); return false; }
  $('#formError').hidden = true; return true;
}
document.querySelectorAll('[data-next]').forEach(b => b.onclick = () => go(step + 1));
document.querySelectorAll('[data-prev]').forEach(b => b.onclick = () => go(step - 1));

/* ---------- validate + submit ---------- */
function validate(){
  let first = null;
  document.querySelectorAll('#brief [required]').forEach(inp => {
    const bad = !inp.value.trim(); inp.setAttribute('aria-invalid', String(bad));
    inp.closest('.field').querySelector('.err').classList.toggle('show', bad);
    if (bad && !first) first = inp;
  });
  const imgBad = F.product_images.length < 1 || F.product_images.length > 10;
  $('#f_product_images .err').classList.toggle('show', imgBad); if (imgBad && !first) first = $('#f_product_images');
  const cBad = !$('#consent').checked; $('#consent').closest('.field').querySelector('.err').classList.toggle('show', cBad); if (cBad && !first) first = $('#consent');
  if (first) { showError(t('e_fix')); first.scrollIntoView({ behavior: 'smooth', block: 'center' }); first.focus?.(); return false; }
  $('#formError').hidden = true; return true;
}
function collect(){
  const fd = new FormData($('#brief')), o = {};
  ['client_name','client_contact','brand_name','website','product_name','product_desc','category','audience','goal','cta','offer','language','brand_colors','must_have','must_avoid','mode','notes'].forEach(k => o[k] = (fd.get(k) || '').toString().trim() || null);
  o.duration = Number(fd.get('duration') || 15);
  o.formats = fd.getAll('formats'); if (!o.formats.length) o.formats = ['9:16'];
  return o;
}
function showError(msg){ const e = $('#formError'); e.textContent = msg; e.hidden = false; }
function progress(done, total, label){ $('#progress').hidden = false; $('#progress i').style.width = Math.round(done / total * 100) + '%'; $('#progressText').textContent = label; }

async function uploadAll(id){
  const refs = {}; const total = Object.values(F).flat().filter(x => x.file).length; let done = 0;
  for (const field of Object.keys(F)) {
    refs[field] = [];
    for (const it of F[field]) {
      if (it.file) {
        progress(done, total + 1, `${t('uploading')} ${done + 1}/${total} · ${it.name}`);
        const path = `orders/${id}/${field}/${safeName(it.name)}`;
        const { error } = await sb.storage.from('intake').upload(path, it.file, { upsert: false });
        if (error) throw new Error(`${it.name}: ${error.message}`);
        const { data } = sb.storage.from('intake').getPublicUrl(path);
        refs[field].push({ path, url: data.publicUrl, name: it.name, size: it.size, note: it.note || '' });
        done++;
      } else refs[field].push({ link: it.link, note: it.note || '' });
    }
  }
  progress(total, total + 1, t('saving'));
  return refs;
}

$('#brief').addEventListener('submit', async e => {
  e.preventDefault();
  for (let i = 1; i <= STEPS; i++) if (!validateStep(i)) { if (i !== step) show(i); return; }
  if (!validate()) return;
  const btn = $('#submitBtn'); btn.disabled = true; btn.classList.add('is-loading');
  const id = uuid(), row = collect();
  try {
    const refs = await uploadAll(id);
    Object.assign(row, { id, product_images: refs.product_images, logo: refs.logo[0] || null, ref_vo: refs.ref_vo, ref_video: refs.ref_video, ref_vibes: refs.ref_vibes });
    const { error } = await sb.from('orders').insert(row);
    if (error) throw new Error(error.message);
    progress(1, 1, '');
    $('#okId').textContent = id.slice(0, 8); $('#okId').dataset.full = id; $('#okContact').textContent = row.client_contact;
    $('#brief').hidden = true; $('#success').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    console.error(err); showError(`${t('e_fail')} — ${err.message}`); $('#progress').hidden = true;
  } finally { btn.disabled = false; btn.classList.remove('is-loading'); }
});
$('#copyId').onclick = () => navigator.clipboard.writeText($('#okId').dataset.full).then(() => toast(t('copied')));
$('#newOrder').onclick = () => location.reload();

setLang(lang);
loadLibrary();
</script>
</body>
</html>
